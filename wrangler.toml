name = "kaushalpath"
main = "cloudflare-worker.mjs"
compatibility_date = "2026-10-25"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[env.preview]
name = "kaushalpath-preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
