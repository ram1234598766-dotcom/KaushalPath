name: KaushalPath Vercel quality checks

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "api/**"
      - "vercel.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/kaushalpath-ai-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "api/**"
      - "vercel.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/kaushalpath-ai-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application checks
        run: |
          npm test
          node --check public/app.js
          node --check api/study-guide.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8')); console.log('Vercel config JSON is valid')"
