name: KaushalPath deployment quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate Cloudflare Pages assets and Function routing
        run: |
          node --check scripts/cloudflare-build.mjs
          npm run build:cloudflare
          node --check functions/api/study-guide.js

      - name: Run application checks
        run: |
          npm test
          node --check app.js
          node --check api/study-guide.mjs
